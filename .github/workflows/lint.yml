name: Lint
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Cache pre-commit
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: "pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}"

      - name: Run pre-commit
        run: |
          uv pip install --system pre-commit
          pre-commit run --all-files

  merge-pre-commit-update:
    needs: lint
    # Merge only the pre-commit auto-update PR (branch set in pre-commit-auto-update.yml), never a fork's lookalike.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'create-pull-request/pre-commit' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Merge pull request
        run: |
          gh pr merge \
              --merge \
              --repo="${GITHUB_REPOSITORY}" \
              "${PR_NUMBER}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Merge as a collaborator so the merge commit's push to master starts Lint; GITHUB_TOKEN pushes don't trigger workflows.
          GH_TOKEN: ${{ secrets.DOT_STAR_TOKEN }}
