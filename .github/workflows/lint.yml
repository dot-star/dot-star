name: Lint
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: "pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}"

      - name: Run pre-commit
        run: |
          uv pip install --system pre-commit
          pre-commit run --all-files

  merge-pre-commit-update:
    needs: lint
    # Merge only the pre-commit auto-update PR (branch set in pre-commit-auto-update.yml), never a fork's lookalike.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'create-pull-request/pre-commit' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Merge pull request
        run: |
          gh pr merge \
              --merge \
              --repo="${GITHUB_REPOSITORY}" \
              "${PR_NUMBER}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Merge as a collaborator so the merge commit's push to master starts Lint; GITHUB_TOKEN pushes don't trigger workflows.
          GH_TOKEN: ${{ secrets.DOT_STAR_TOKEN }}

  merge-dependabot-update:
    needs: lint
    # Merge only Dependabot's own PRs, never a fork's lookalike.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Leave major updates open for review; they can carry breaking changes.
      - name: Merge patch update
        if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr merge \
              --merge \
              --repo="${GITHUB_REPOSITORY}" \
              "${PR_NUMBER}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Read from the Dependabot secrets store; Dependabot-triggered runs can't see Actions secrets.
          GH_TOKEN: ${{ secrets.DOT_STAR_TOKEN }}

      - name: Merge minor update
        if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge \
              --merge \
              --repo="${GITHUB_REPOSITORY}" \
              "${PR_NUMBER}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Read from the Dependabot secrets store; Dependabot-triggered runs can't see Actions secrets.
          GH_TOKEN: ${{ secrets.DOT_STAR_TOKEN }}
