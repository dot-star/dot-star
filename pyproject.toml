[project]
name = "dot-star"
version = "0"
requires-python = ">=3.12"

[dependency-groups]
# Give ty (run as `uv check`, which syncs this group into its env) the packages `scripts/` imports.
dev = [
    "packaging",
    "pre-commit",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    # Flag names that shadow a builtin, such as a parameter called id or type.
    "A",
    # Require type annotations on every function; ty checks only what is annotated.
    "ANN",
    # Flag parameters a function accepts but never reads.
    "ARG",
    # Catch likely bugs, such as a zip() that silently drops the longer list's tail.
    "B",
    # Flag a broad except Exception that swallows every error.
    "BLE",
    # Flag redundant comprehensions and collection calls, such as list() around a list comprehension.
    "C4",
    # Require a time zone on datetimes, so now() never silently uses local time.
    "DTZ",
    # Flag commented-out code left behind.
    "ERA",
    # Keep each shebang in step with the file's executable bit.
    "EXE",
    # Sort imports and keep each on its own line.
    "I",
    # Flag implicitly joined strings, such as a list missing a comma between two literals.
    "ISC",
    # Enforce standard Python naming, such as snake_case function names.
    "N",
    # Flag no-op code, such as a pass beside a docstring or a duplicate class field.
    "PIE",
    # Drop a needless `return None` from a function that never returns a value.
    "RET501",
    # Spell out `return None` in a function that returns a value on other paths.
    "RET502",
    # Require an explicit return at the end of a function that returns a value on other paths.
    "RET503",
    # Run Ruff's own checks, such as a mutable default argument or a lookalike Unicode character.
    "RUF",
    # Rewrite outdated syntax into the form the pinned interpreter supports, such as list[str] over List[str].
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# Allow lookalike Unicode characters in the hook that detects them, whose docs and tests spell them out.
"ai/files/Users/user/.claude/hooks/block_hidden_characters*.py" = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# Give each imported name its own line, so adding or dropping one touches one line.
force-single-line = true

[tool.pyright]
# Leave type checking to ty; run pyright only for the rules ty lacks.
typeCheckingMode = "off"
# Reject a bare `dict` or `list`, which strict Pylance reads as `dict[Unknown, Unknown]`.
reportMissingTypeArgument = "error"
# Skip the worktree checkouts, which each hold a full copy of the tree.
exclude = [
    ".claude",
]

[tool.ty.src]
# Skip the worktree checkouts, which each hold a full copy of the tree.
exclude = [".claude"]
