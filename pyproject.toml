[project]
name = "dot-star"
version = "0"
requires-python = ">=3.12"

[dependency-groups]
# Give ty (run as `uv check`, which syncs this group into its env) the packages `scripts/` imports.
dev = [
    "packaging",
    "pre-commit",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    # Require type annotations on every function; ty checks only what is annotated.
    "ANN",
]

[tool.ty.src]
# Skip the worktree checkouts, which each hold a full copy of the tree.
exclude = [".claude"]
