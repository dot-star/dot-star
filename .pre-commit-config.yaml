repos:
  - repo: local
    hooks:
      - id: settings-tests
        name: settings tests
        language: system
        entry: python3 ai/files/Users/user/.claude/settings_test.py
        files: ^ai/files/Users/user/\.claude/(settings\.json|settings_test\.py|settings_test_cases\.json|hooks/)
        pass_filenames: false

      - id: doc-pointers-resolve
        name: doc pointers resolve
        language: system
        entry: bash script/check_doc_pointers_resolve.sh
        files: \.md$
        pass_filenames: false

      - id: remind-style-guide-tests
        name: remind style guide tests
        language: system
        entry: bash ai/files/Users/user/.claude/hooks/remind_style_guide_test.sh
        files: ^ai/(contexts/|files/Users/user/\.claude/(hooks/remind_style_guide|styles/))
        pass_filenames: false

      - id: shfmt
        name: shfmt
        language: golang
        additional_dependencies: ["mvdan.cc/sh/v3/cmd/shfmt@v3.13.0"]
        entry: shfmt --indent=4 --diff --write
        types: [shell]
        exclude: version_control/git-completion\.bash

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.89
    hooks:
      - id: ty
        args: ["--isolated"]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
